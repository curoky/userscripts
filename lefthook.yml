commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,json,jsonc,mjs,cjs,ts,yaml,yml}"
      run: pnpm exec biome check --no-errors-on-unmatched {staged_files}

pre-push:
  commands:
    check:
      run: pnpm check
